#
# 서버 점검(maintenance) 처리
# ---------------------------------------------------------------------------
# 설정 파일에 disabled 를 붙이면 그 서버는 처음부터 제외된 채로 뜹니다.
#
# 다만 실제 운영에서는 설정을 고치고 리로드하는 것보다
# 관리 소켓으로 즉시 빼는 편이 훨씬 빠르고 안전합니다. 아래 주석 참고.
#

frontend web
  bind :80
  default_backend web_servers

backend web_servers
  balance roundrobin
  server web1 10.0.0.11:8080 check
  server web2 10.0.0.12:8080 check disabled

# ---------------------------------------------------------------------------
# 관리 소켓으로 무중단 처리하기 (재시작 불필요)
#
#   # 점검 시작 - 새 연결을 받지 않음 (기존 연결은 유지)
#   echo "disable server web_servers/web2" | socat stdio /run/haproxy/haproxy.sock
#
#   # 기존 연결까지 서서히 빼기 (drain)
#   echo "set server web_servers/web2 state drain" | socat stdio /run/haproxy/haproxy.sock
#
#   # 점검 종료 - 다시 투입
#   echo "set server web_servers/web2 state ready" | socat stdio /run/haproxy/haproxy.sock
#   echo "enable server web_servers/web2"          | socat stdio /run/haproxy/haproxy.sock
#
#   # 현재 상태 확인
#   echo "show servers state" | socat stdio /run/haproxy/haproxy.sock
