#==============================================================================
# 15 — 외부 에이전트로 서버 상태·가중치 동적 제어 (agent-check)
#==============================================================================
# README: "설정 예제 모음 > 11. 외부 프로그램으로 서버 상태 동적 제어"
#
# 백엔드 서버마다 아주 작은 "에이전트"를 띄워 두면, HAProxy가 주기적으로 거기
# 접속해 한 줄을 읽고 그 내용대로 서버를 빼거나 넣거나 가중치를 바꿉니다.
# 설정 파일을 고치지도, HAProxy를 리로드하지도 않습니다.
#
# 애플리케이션이 스스로 판단해 트래픽을 조절하게 만들 수 있습니다. 예를 들어
# 배포 스크립트가 "이제 나 빼줘"라고 말하고, 캐시를 다 채운 뒤 "다시 넣어줘"라고
# 말하는 식입니다.
#
# [적용]
#   1. 각 백엔드 서버에 에이전트를 띄웁니다 (아래 [에이전트 만들기] 참고)
#   2. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   3. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   4. 10.0.0.x 주소와 포트를 실제 환경에 맞게 수정
#   5. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   /usr/share/haproxy/examples/check-example.sh 15-agent-check.cfg
#
# 이 방식은 패키지 기본 설정의 chroot를 그대로 두고도 동작합니다. HAProxy가
# 프로그램을 실행하는 게 아니라 TCP로 물어보기만 하기 때문입니다.
# 스크립트를 직접 실행시키고 싶다면 16-external-check.cfg 를 보세요. 다만 그쪽은
# chroot를 꺼야 하고 HAProxy 공식 문서가 권하지 않는 방식입니다.
#
#------------------------------------------------------------------------------
# 에이전트가 돌려줄 수 있는 말
#------------------------------------------------------------------------------
# 공백·쉼표로 구분해 여러 개를 한 줄에 적을 수 있고, 적지 않은 항목은 그대로
# 유지됩니다. 크게 세 갈래입니다.
#
#   [헬스 상태]  up                 정상으로 되돌림
#                down / fail / stopped   장애로 처리 (통계 화면에 각각 다르게 표시)
#
#   [관리 상태]  ready              drain·maint 해제
#                drain              새 연결만 차단 (기존 연결·세션 고정은 유지)
#                maint              완전히 제외, 헬스체크도 중단
#
#   [용량]       50%  /  weight:25  가중치 조정
#                maxconn:30         동시 연결 상한 조정
#
# 뒤에 설명을 붙이면 통계 화면에 같이 뜹니다. 이때 '#' 앞에 반드시 공백이
# 있어야 합니다.
#
#     down #DB 점검 중        (O)
#     down#DB 점검 중         (X) — 통째로 모르는 단어가 되어 무시됩니다
#
# 주의할 점 두 가지:
#
#   * maint 는 ready 를 받기 전까지 풀리지 않습니다. maint 상태에서 down 이나
#     50% 를 보내도 무시되니, 반드시 ready 를 먼저 보내세요.
#
#   * 백분율은 아래 server 줄에 적은 weight 기준입니다. weight를 생략하면
#     기본값이 1이라 50%가 0으로 내려가 서버가 통째로 빠집니다. 그래서 이
#     예제는 weight 100 을 명시했습니다.
#
#------------------------------------------------------------------------------
# 에이전트 만들기 — 백엔드 서버(10.0.0.11 등)에서 실행합니다
#------------------------------------------------------------------------------
# 상태 파일 한 줄을 그대로 읽어 주는 것이 가장 단순하고 확실합니다.
#
#     sudo dnf install -y socat
#     echo up | sudo tee /etc/haproxy-agent-state
#     socat TCP-LISTEN:9101,fork,reuseaddr SYSTEM:'cat /etc/haproxy-agent-state'
#
# 이제 그 서버에서 아래처럼 파일만 바꾸면 트래픽이 즉시 조절됩니다.
#
#     echo drain | sudo tee /etc/haproxy-agent-state   # 새 연결 차단
#     echo ready | sudo tee /etc/haproxy-agent-state   # 다시 투입
#     echo "50%" | sudo tee /etc/haproxy-agent-state   # 절반만 받기
#
# 실제로는 systemd 서비스로 등록해 두고, 배포 스크립트나 애플리케이션이 상태
# 파일을 갱신하게 만듭니다. 부하에 따라 자동으로 조절하고 싶다면 상태 파일
# 대신 계산 결과를 출력하는 스크립트를 SYSTEM: 뒤에 지정하면 됩니다.
#
# 에이전트 포트는 아무나 접속하지 못하게 막으세요. 이 포트를 잡으면 서버를
# 마음대로 빼고 넣을 수 있습니다.
#==============================================================================

frontend web
  bind :80
  default_backend web_servers

backend web_servers
  balance roundrobin

  # 평소 살아 있는지는 기존 헬스체크가 봅니다. 에이전트는 그것과 별개로,
  # 서버가 스스로 알려 주고 싶은 것을 전달하는 통로입니다.
  option httpchk GET /health
  http-check expect status 200

  # agent-check  에이전트 검사 켜기
  # agent-port   에이전트가 듣고 있는 포트 (주소는 서버 주소를 그대로 씁니다.
  #              다른 곳에 띄웠다면 agent-addr 로 지정하세요.)
  # agent-inter  물어보는 주기
  # weight 100   백분율 응답이 의미를 갖도록 넉넉한 기준값을 줍니다.
  server web1 10.0.0.11:8080 weight 100 check inter 2s agent-check agent-port 9101 agent-inter 2s
  server web2 10.0.0.12:8080 weight 100 check inter 2s agent-check agent-port 9101 agent-inter 2s

# 지금 상태는 통계 페이지에서 바로 보입니다. 에이전트가 개입한 서버는
# "DRAIN (agent)", "DOWN (agent)" 처럼 (agent) 가 붙어 구분됩니다.
#
#   curl -s "http://127.0.0.1:9000/haproxy_stats;csv" | cut -d, -f1,2,18,19
