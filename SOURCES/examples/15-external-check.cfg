#==============================================================================
# 15 — 외부 스크립트를 실행해 헬스체크 (external-check)
#==============================================================================
# README: "설정 예제 모음 > 11. 외부 프로그램으로 서버 상태 동적 제어"
#
# HAProxy가 서버마다 지정한 프로그램을 직접 실행하고, 종료 코드로 판정합니다.
#
#     0        정상
#     0 아님   장애 — 해당 서버를 로드 밸런싱에서 제외
#
# TCP나 HTTP로 표현할 수 없는 조건을 검사할 때 씁니다. 예를 들어 "복제 지연이
# 10초를 넘으면 뺀다", "라이선스 서버가 살아 있을 때만 넣는다" 같은 것입니다.
#
#------------------------------------------------------------------------------
# 읽지 않고 쓰면 반드시 실패합니다 — 먼저 세 가지를 확인하세요
#------------------------------------------------------------------------------
# 1. global 섹션을 고쳐야 합니다. 이 파일만 붙여 넣으면 HAProxy가 아예 뜨지
#    않습니다("unable to find required 'global.external-check'").
#    /etc/haproxy/haproxy.cfg 의 global 섹션에 두 줄을 넣으세요.
#
#        external-check
#        insecure-fork-wanted
#
# 2. chroot 를 꺼야 합니다. 패키지 기본 설정에는 이 줄이 들어 있습니다.
#
#        chroot /var/lib/haproxy      <-- 주석 처리하거나 지우세요
#
#    HAProxy는 격리된 뒤에 스크립트를 실행합니다. /var/lib/haproxy 는 빈
#    디렉터리라 셸도 스크립트도 그 안에 없습니다. 이 줄을 남겨 두면 모든
#    서버가 종료 코드 255 로 실패해 전부 DOWN 이 됩니다. 헬스체크가 고장 난
#    것이지 서버가 죽은 게 아닌데도 그렇게 보이므로 알아채기 어렵습니다.
#
# 3. 스크립트는 haproxy 계정이 읽고 실행할 수 있어야 합니다 (chmod 755).
#
#------------------------------------------------------------------------------
# 그래도 agent-check 쪽을 먼저 검토하세요
#------------------------------------------------------------------------------
# HAProxy 공식 문서는 external-check 를 "strongly recommended against" 라고
#적고, 대안으로 에이전트를 권합니다. 이유는 두 가지입니다.
#
#   * insecure-fork-wanted 는 이름 그대로입니다. HAProxy가 실행 중에 프로세스를
#     만들지 못하도록 막아 두는 보호 장치를 통째로 끕니다.
#   * HAProxy는 멀티스레드로 동작합니다. 스레드가 잡고 있던 락을 그대로 물려받은
#     자식 프로세스가 영영 끝나지 않는 일이 생길 수 있습니다.
#
# 게다가 chroot를 포기해야 합니다. 같은 목적을 chroot를 유지한 채 더 세밀하게
# 달성할 수 있는 14-agent-check.cfg 를 먼저 보세요.
#
# [적용]
#   1. 위 세 가지를 먼저 처리
#   2. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   3. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   4. 스크립트 경로와 10.0.0.x 주소를 실제 환경에 맞게 수정
#   5. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   /usr/share/haproxy/examples/check-example.sh 15-external-check.cfg
#
#   이 예제는 global 설정이 따로 필요해서 15-external-check.global 을 뼈대로
#   씁니다. check-example.sh 가 알아서 골라 줍니다.
#
#------------------------------------------------------------------------------
# 스크립트가 받는 것
#------------------------------------------------------------------------------
# 인자 네 개:
#
#     $1 프론트엔드 주소   $2 프론트엔드 포트   $3 서버 주소   $4 서버 포트
#
# backend 섹션에는 붙어 있는 프론트엔드가 없으므로 $1 과 $2 는 "NOT_USED" 가
# 들어옵니다. 서버 정보는 환경 변수로 받는 편이 확실합니다.
#
#     HAPROXY_SERVER_NAME     HAPROXY_SERVER_ADDR     HAPROXY_SERVER_PORT
#     HAPROXY_SERVER_CURCONN  HAPROXY_SERVER_MAXCONN  HAPROXY_SERVER_SSL
#     HAPROXY_PROXY_NAME      HAPROXY_PROXY_ADDR      HAPROXY_PROXY_PORT
#
# 기본적으로 환경은 위 변수들만 남기고 비워집니다. PATH 조차 비어 있으므로
# 아래처럼 external-check path 를 지정하거나 명령을 전부 절대 경로로 쓰세요.
#
# 예시 스크립트 — /opt/haproxy-checks/check-replica.sh (chmod 755)
#
#     #!/bin/bash
#     # 복제 지연이 10초를 넘으면 이 서버를 뺀다.
#     LAG=$(mysql -h "$HAPROXY_SERVER_ADDR" -u haproxy_check -N -B \
#                 -e "SHOW REPLICA STATUS\G" 2>/dev/null \
#           | awk -F: '/Seconds_Behind_Source/ {print $2+0}')
#     [ -z "$LAG" ] && exit 1        # 조회 실패도 장애로 본다
#     [ "$LAG" -gt 10 ] && exit 1
#     exit 0
#
# 스크립트는 짧고 빨라야 합니다. 검사 주기마다 서버 수만큼 프로세스가 새로
# 뜨므로, 무거운 스크립트를 짧은 주기로 돌리면 그 자체가 부하가 됩니다.
# 타임아웃도 스크립트 안에서 직접 챙기세요 (timeout 명령 등).
#==============================================================================

backend web_servers
  balance roundrobin

  option external-check

  # 환경이 비워진 채로 실행되므로 PATH를 직접 줍니다.
  external-check path "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"

  # 실행할 프로그램. chroot 를 껐으므로 평범한 절대 경로가 그대로 통합니다.
  external-check command /opt/haproxy-checks/check-replica.sh

  server web1 10.0.0.11:8080 check inter 10s
  server web2 10.0.0.12:8080 check inter 10s

# 검사가 왜 실패하는지 보려면 통계 페이지의 LastChk 열이나 아래를 보세요.
# 종료 코드가 그대로 찍힙니다. 255 가 보이면 십중팔구 chroot 문제입니다.
#
#   echo "show servers state" | sudo socat stdio /run/haproxy/haproxy.sock
