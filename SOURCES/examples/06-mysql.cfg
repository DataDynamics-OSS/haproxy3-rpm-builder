#
# MySQL / MariaDB 부하 분산
# ---------------------------------------------------------------------------
# 데이터베이스는 HTTP 가 아니므로 반드시 mode tcp 로 동작시킵니다.
# 연결이 오래 유지되므로 타임아웃도 넉넉히 잡아야 합니다.
# 기본값 50초를 그대로 두면 조금 긴 쿼리가 도중에 끊깁니다.
#
# 사전 준비: DB 에 점검 전용 계정을 만들어 두세요.
#   CREATE USER 'haproxy_check'@'10.0.0.%';
#   (비밀번호 없이 접속만 되면 되고 아무 권한도 줄 필요가 없습니다)
#

# --- 쓰기용 (마스터 한 대에만) ---------------------------------------------
listen mysql_write
  bind :3306
  mode tcp
  option tcplog
  timeout client 600s
  timeout server 600s
  option mysql-check user haproxy_check

  server master  10.0.0.21:3306 check
  # backup : 평소에는 쓰지 않고 위 서버가 모두 죽었을 때만 사용
  server standby 10.0.0.22:3306 check backup

# --- 읽기용 (복제 서버들에 분산) -------------------------------------------
listen mysql_read
  bind :3307
  mode tcp
  option tcplog
  balance leastconn
  timeout client 600s
  timeout server 600s
  option mysql-check user haproxy_check

  server replica1 10.0.0.22:3306 check
  server replica2 10.0.0.23:3306 check

# 애플리케이션에서 쓰기는 3306, 읽기는 3307 로 접속하도록 나누면 됩니다.
