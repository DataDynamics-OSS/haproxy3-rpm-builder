#
# HTTPS 처리 (SSL 종료) + HTTP/2
# ---------------------------------------------------------------------------
# HAProxy가 HTTPS를 대신 처리하고 뒤쪽 서버와는 평문 HTTP로 통신합니다.
# 인증서를 한 곳에서만 관리하면 되므로 가장 널리 쓰이는 구성입니다.
#
# 사전 준비: 인증서와 개인키를 한 파일로 합쳐 두어야 합니다.
#   mkdir -p /etc/haproxy/certs
#   cat /etc/letsencrypt/live/example.com/fullchain.pem \
#       /etc/letsencrypt/live/example.com/privkey.pem \
#       > /etc/haproxy/certs/example.com.pem
#   chmod 600 /etc/haproxy/certs/example.com.pem
#
# 주의: 인증서 파일이 없으면 haproxy -c 검사가 실패합니다.
#

frontend web
  bind :80
  # alpn h2,http/1.1 : HTTP/2 지원 브라우저와는 HTTP/2로 통신
  bind :443 ssl crt /etc/haproxy/certs/example.com.pem alpn h2,http/1.1

  # HTTP로 들어온 요청을 HTTPS로 되돌려 보냄.
  # code 301 을 빼면 302(임시 이동)로 응답합니다.
  http-request redirect scheme https code 301 unless { ssl_fc }

  http-response set-header Strict-Transport-Security "max-age=31536000"
  default_backend web_servers

backend web_servers
  balance roundrobin
  option forwardfor

  # 원래 요청이 HTTPS였음을 애플리케이션에 알려 줍니다.
  # 이게 없으면 애플리케이션이 만드는 링크가 http:// 로 나가
  # 무한 리다이렉트가 생기는 일이 흔합니다.
  http-request set-header X-Forwarded-Proto https if { ssl_fc }

  server web1 10.0.0.11:8080 check
  server web2 10.0.0.12:8080 check
