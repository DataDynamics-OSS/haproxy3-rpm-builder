#
# 접속 제한과 속도 제한
# ---------------------------------------------------------------------------
# 특정 IP 에서 짧은 시간에 과도한 요청이 오면 차단합니다.
# 단순한 크롤러나 무차별 로그인 시도를 막는 데 효과적입니다.
#
# 임계값은 서비스 성격에 따라 크게 다릅니다. 처음에는 넉넉하게 잡고
# 통계 페이지의 Denied 열을 보면서 조여 나가세요.
# 너무 빡빡하면 정상 사용자가 차단됩니다.
#

frontend web
  bind :80

  # IP 별 요청 횟수를 기억하는 표.
  # http_req_rate(10s) : 최근 10초간의 요청 수를 셈
  # expire 30s         : 30초간 요청이 없으면 기록 삭제
  stick-table type ip size 100k expire 30s store http_req_rate(10s)
  http-request track-sc0 src

  # 10초에 100회를 넘으면 429 Too Many Requests 로 거절
  http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

  # 관리자 경로는 내부망에서만 허용
  acl allowed_net src 10.0.0.0/8 192.168.0.0/16
  http-request deny if { path_beg /admin } !allowed_net

  default_backend web_servers

backend web_servers
  # maxconn : 그 서버가 동시에 처리할 연결 수 제한.
  #           초과분은 HAProxy 가 대기시켜 주므로 트래픽 폭주로
  #           백엔드가 통째로 넘어가는 것을 막아 줍니다.
  server web1 10.0.0.11:8080 check maxconn 200
