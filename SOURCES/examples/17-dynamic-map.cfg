#==============================================================================
# 17 — 맵 파일로 요청 단위 동적 차단
#==============================================================================
# README: "설정 예제 모음 > 12. 외부 프로그램으로 서버 상태 동적 제어
#          > 방법 4 — 맵 파일: 요청 단위로 동적 차단"
#
# 15·16번이 "서버"를 빼고 넣는 방법이었다면, 이것은 "요청"을 걸러 내는
# 방법입니다. 차단 목록을 파일로 두고 관리 소켓으로 갱신하면 설정 변경도
# 리로드도 없이 즉시 반영됩니다.
#
# 침입 탐지 도구나 어뷰징 탐지 배치가 차단 목록을 밀어 넣는 용도로 씁니다.
#
# [먼저 맵 파일을 만드세요]
# 빈 파일이라도 미리 있어야 합니다. 없으면 HAProxy가 아예 뜨지 않습니다
# ("failed to open pattern file").
#
#     sudo touch /etc/haproxy/blocked.map
#
# [적용]
#   1. 위 맵 파일 생성
#   2. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   3. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   4. 10.0.0.x 주소와 포트를 실제 환경에 맞게 수정
#   5. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   sudo touch /etc/haproxy/blocked.map
#   /usr/share/haproxy/examples/check-example.sh 17-dynamic-map.cfg
#
#------------------------------------------------------------------------------
# 목록 갱신은 관리 소켓으로 — 리로드 없이 즉시 반영됩니다
#------------------------------------------------------------------------------
#   echo "add map /etc/haproxy/blocked.map 1.2.3.4 blocked" | sudo socat stdio /run/haproxy/haproxy.sock
#   echo "del map /etc/haproxy/blocked.map 1.2.3.4"         | sudo socat stdio /run/haproxy/haproxy.sock
#   echo "show map /etc/haproxy/blocked.map"                | sudo socat stdio /run/haproxy/haproxy.sock
#
# [주의] 소켓으로 한 갱신은 메모리에만 반영됩니다. HAProxy를 재시작하면
#        사라지므로, 영구히 유지하려면 맵 파일에도 함께 기록해 두세요.
#        차단 스크립트가 두 가지를 다 하도록 만드는 것이 안전합니다.
#
#          echo "1.2.3.4 blocked" | sudo tee -a /etc/haproxy/blocked.map
#          echo "add map /etc/haproxy/blocked.map 1.2.3.4 blocked" \
#            | sudo socat stdio /run/haproxy/haproxy.sock
#
# [맵 파일 형식] 한 줄에 "키 값" 하나씩입니다. 값은 아무 문자열이나 되며,
#                아래 설정은 값이 무엇이든 "있기만 하면"(-m found) 차단합니다.
#
#          1.2.3.4       blocked
#          10.20.0.0/16  blocked
#==============================================================================

frontend web
  bind :80

  # src 를 맵에서 찾아보고, 걸리면 403으로 거절합니다.
  # map_ip 는 키를 IP·CIDR로 해석하므로 대역 단위 차단도 됩니다.
  acl is_blocked src,map_ip(/etc/haproxy/blocked.map) -m found
  http-request deny deny_status 403 if is_blocked

  default_backend web_servers

backend web_servers
  balance roundrobin
  server web1 10.0.0.11:8080 check
  server web2 10.0.0.12:8080 check

# 짧은 시간에 몰아치는 요청을 자동으로 막는 것이 목적이라면 맵 파일보다
# 12-rate-limit.cfg 의 stick-table 쪽이 맞습니다. 맵 파일은 "이미 판정이 끝난
# 대상"의 목록을 외부에서 밀어 넣는 용도입니다.
