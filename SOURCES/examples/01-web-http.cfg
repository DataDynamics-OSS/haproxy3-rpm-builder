#
# 웹 서버 부하 분산 (HTTP)
# ---------------------------------------------------------------------------
# 가장 기본이 되는 형태입니다. 여러 대의 웹 서버로 요청을 나눠 주고,
# 헬스체크에 실패한 서버는 자동으로 제외합니다.
#
# 사용법: 아래 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣고 IP를 수정하세요.
# 시험:   haproxy -c -f /etc/haproxy/haproxy.cfg -f 이파일
#

frontend web
  bind :80
  # 백엔드에 접속자의 실제 IP를 X-Forwarded-For 헤더로 전달
  option forwardfor
  default_backend web_servers

backend web_servers
  balance roundrobin

  # 헬스체크: /health 경로가 200을 돌려줄 때만 정상으로 판정.
  # 무거운 페이지 대신 가볍게 200만 반환하는 전용 경로를 쓰세요.
  option httpchk GET /health
  http-check expect status 200

  # inter 5s : 5초마다 검사
  # fall 3   : 3회 연속 실패해야 죽은 것으로 판정
  # rise 2   : 2회 연속 성공해야 다시 투입
  server web1 10.0.0.11:8080 check inter 5s fall 3 rise 2
  server web2 10.0.0.12:8080 check inter 5s fall 3 rise 2
