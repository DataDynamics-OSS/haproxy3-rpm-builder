#
# Redis 부하 분산 (마스터 자동 판별)
# ---------------------------------------------------------------------------
# Redis 는 마스터 한 대에만 써야 하므로, 실제로 접속해서 역할을 확인하는
# 헬스체크를 씁니다. 복제(replica) 서버는 검사를 통과하지 못해 자동으로
# 제외되고, 장애 조치로 마스터가 바뀌면 트래픽이 알아서 옮겨 갑니다.
#
# send 줄의 \r\n 과 info\ replication 의 백슬래시는 문법상 반드시 필요합니다.
#

listen redis
  bind :6379
  mode tcp
  option tcplog
  balance first

  option tcp-check
  tcp-check send PING\r\n
  tcp-check expect string +PONG
  tcp-check send info\ replication\r\n
  tcp-check expect string role:master
  tcp-check send QUIT\r\n
  tcp-check expect string +OK

  server redis1 10.0.0.31:6379 check inter 1s
  server redis2 10.0.0.32:6379 check inter 1s
