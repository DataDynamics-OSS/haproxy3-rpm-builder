#
# PostgreSQL 부하 분산
# ---------------------------------------------------------------------------
# 방식은 MySQL 과 같고 점검 옵션만 다릅니다.
#
# 사전 준비:
#   CREATE ROLE haproxy_check LOGIN;
#   그리고 pg_hba.conf 에 이 계정의 접속을 허용하는 줄을 추가해야 합니다.
#

listen postgresql
  bind :5432
  mode tcp
  option tcplog
  balance leastconn
  timeout client 600s
  timeout server 600s
  option pgsql-check user haproxy_check

  server pg1 10.0.0.21:5432 check
  server pg2 10.0.0.22:5432 check backup
