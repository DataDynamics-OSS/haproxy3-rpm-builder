#
# 일반 TCP 서비스 중계
# ---------------------------------------------------------------------------
# HTTP 가 아닌 서비스(메일, 사설 프로토콜 등)는 mode tcp 로 그대로 흘려보냅니다.
#
# 주의: mode tcp 에서는 option httplog 를 쓰면 안 됩니다. HTTP 정보가 없어
#       로그가 비어 보입니다. option tcplog 로 바꿔 주세요.
#       defaults 에 mode http 가 있어도 각 섹션에서 덮어쓰면 됩니다.
#

listen smtp
  bind :25
  mode tcp
  option tcplog
  balance roundrobin

  # 포트가 열려 있는지만 확인
  option tcp-check

  # 더 정확히 보려면 실제 주고받는 문자열을 지정합니다.
  # 아래는 메일 서버가 접속 시 보내는 220 인사말을 확인하는 예입니다.
  #tcp-check expect string 220

  server mail1 10.0.0.41:25 check
  server mail2 10.0.0.42:25 check
