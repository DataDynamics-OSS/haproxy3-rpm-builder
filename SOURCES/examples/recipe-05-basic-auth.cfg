#
# HTTP 기본 인증 (Basic Auth)
# ---------------------------------------------------------------------------
# 브라우저 기본 로그인 창으로 접근을 제한합니다. 관리 페이지나 사내
# 도구처럼 간단한 보호만 필요한 곳에 씁니다.
#
# 비밀번호 해시 만들기:
#   openssl passwd -6 '실제비밀번호'
#   (-6 은 SHA-512. 결과를 아래 password 뒤에 그대로 붙여 넣으세요)
#
# 주의: Basic Auth 는 자격 증명을 매 요청마다 그대로 보냅니다.
#       반드시 HTTPS 와 함께 쓰세요. (02-https.cfg 참고)
#

userlist site_users
  # 해시 저장 (권장)
  user admin  password $6$rounds=5000$examplesalt$Xj7QbF0KZ8vP.EXAMPLEHASHREPLACEME

  # 평문 저장 (시험용으로만. 설정 파일을 읽을 수 있는 사람에게 그대로 노출됩니다)
  #user viewer insecure-password changeme

frontend web
  bind :80

  acl auth_ok http_auth(site_users)
  http-request auth realm "Restricted Area" unless auth_ok

  default_backend web_servers

backend web_servers
  balance roundrobin
  server web1 10.0.0.11:8080 check

# ---------------------------------------------------------------------------
# 특정 경로에만 인증을 거는 방법
#
# frontend web
#   bind :80
#   acl is_admin_path path_beg /admin
#   acl auth_ok       http_auth(site_users)
