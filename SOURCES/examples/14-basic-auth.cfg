#==============================================================================
# 14 — HTTP 기본 인증 (Basic Auth)
#==============================================================================
# README: "설정 예제 모음 > 11. HTTP 기본 인증 (Basic Auth)"
#
# 브라우저가 띄우는 기본 로그인 창으로 접근을 제한합니다. 관리 페이지나 사내
# 도구처럼 간단한 보호만 필요한 곳에 쓰기 좋습니다. 애플리케이션을 전혀 고치지
# 않고 HAProxy 단에서 막을 수 있다는 것이 장점입니다.
#
# [적용]
#   1. 아래 [비밀번호 해시 만들기]로 해시를 만들어 password 뒤에 붙여 넣기
#   2. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   3. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   4. 10.0.0.x 주소와 포트를 실제 환경에 맞게 수정
#   5. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   /usr/share/haproxy/examples/check-example.sh 14-basic-auth.cfg
#
# [반드시 HTTPS와 함께 쓰세요]
# Basic Auth는 자격 증명을 매 요청마다 실어 보냅니다. 평문 HTTP로 쓰면 같은
# 네트워크에 있는 누구나 아이디와 비밀번호를 그대로 볼 수 있습니다.
# 03-https-offload.cfg 를 함께 적용하세요.
#
# [비밀번호 해시 만들기]
#
#     openssl passwd -6 '실제비밀번호'
#
# -6 은 SHA-512를 뜻합니다. 출력된 문자열을 아래 password 뒤에 그대로 붙여
# 넣으면 됩니다. 아래 값은 형식을 보여 주기 위한 예시일 뿐이라 그대로 두면
# 아무 비밀번호로도 로그인되지 않습니다.
#==============================================================================

userlist site_users
  # 해시로 저장 (권장)
  user admin  password $6$rounds=5000$examplesalt$Xj7QbF0KZ8vP.EXAMPLEHASHREPLACEME

  # 평문 저장은 시험용으로만 쓰세요. 이름 그대로 안전하지 않은 방식이라,
  # 설정 파일을 읽을 수 있는 사람에게 비밀번호가 그대로 노출됩니다.
  #user viewer insecure-password changeme

frontend web
  bind :80

  # http_auth(site_users) — "이 요청의 자격 증명이 목록과 맞는가"
  # 맞지 않으면(unless) 401을 돌려주고, 브라우저가 로그인 창을 띄웁니다.
  acl auth_ok http_auth(site_users)
  http-request auth realm "Restricted Area" unless auth_ok

  default_backend web_servers

backend web_servers
  balance roundrobin
  server web1 10.0.0.11:8080 check

#------------------------------------------------------------------------------
# 특정 경로에만 인증을 걸고 싶다면
#------------------------------------------------------------------------------
# 사이트 전체는 열어 두고 /admin 아래만 막는 형태입니다. 위의 frontend 대신
# 아래를 쓰세요.
#
#   frontend web
#     bind :80
#     acl is_admin_path path_beg /admin
#     acl auth_ok       http_auth(site_users)
#     http-request auth realm "Admin Only" if is_admin_path !auth_ok
#     default_backend web_servers
#
# 접속자 IP로 막는 편이 더 확실한 경우도 많습니다. 내부망에서만 열어 두면
# 되는 관리 페이지라면 12-rate-limit.cfg 의 allowed_net 방식을 보세요.
#------------------------------------------------------------------------------
