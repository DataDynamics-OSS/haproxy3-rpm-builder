#
# 세션 고정 (sticky session)
# ---------------------------------------------------------------------------
# 로그인 상태를 서버 메모리에 들고 있는 애플리케이션이라면
# 같은 사용자를 계속 같은 서버로 보내야 합니다.
#
# 주의: 세션 고정은 부하가 고르게 나뉘지 않고, 서버가 죽으면 그 서버에
#       묶여 있던 사용자의 로그인이 풀립니다. 가능하다면 세션을 Redis 같은
#       외부 저장소로 빼서 세션 고정 자체가 필요 없게 만드는 편이 낫습니다.
#

frontend web
  bind :80
  default_backend web_servers

backend web_servers
  balance roundrobin

  # HAProxy 가 SRVID 쿠키를 직접 만들어 응답에 넣습니다.
  # indirect nocache : 쿠키가 애플리케이션에 전달되지 않게 하고
  #                    중간 캐시에 저장되지 않게 막습니다.
  cookie SRVID insert indirect nocache

  server web1 10.0.0.11:8080 check cookie web1
  server web2 10.0.0.12:8080 check cookie web2

# ---------------------------------------------------------------------------
# 쿠키를 쓸 수 없는 환경(예: mode tcp)에서는 접속자 IP 로 고정합니다.
#
# backend web_servers
#   balance source
#   server web1 10.0.0.11:8080 check
#   server web2 10.0.0.12:8080 check
