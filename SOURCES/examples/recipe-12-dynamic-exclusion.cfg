#
# 외부 정보로 서버를 동적으로 제외하기
# ---------------------------------------------------------------------------
# 헬스체크는 "서버가 응답하는가"만 봅니다. 하지만 실제로는 응답은 하는데
# 빼야 하는 경우가 많습니다. 배포 중이거나, 디스크가 찼거나, 애플리케이션이
# 자기 상태를 이미 알고 있는 경우입니다.
#
# 그럴 때 쓰는 세 가지 방법을 정리했습니다.
#

# ===========================================================================
# 방법 1. agent-check : 서버가 스스로 상태를 보고
# ===========================================================================
# 각 서버에서 작은 에이전트를 띄워 두면 HAProxy 가 주기적으로 접속해
# 한 줄을 읽어 갑니다. 애플리케이션이 자기 상태를 가장 잘 아므로
# 가장 정확한 방법입니다.
#
# 에이전트가 돌려줄 수 있는 값:
#   up / down     정상 / 제외
#   maint         점검 상태로 전환
#   drain         새 연결만 차단 (기존 연결은 유지)
#   ready         정상 복귀
#   75%           가중치를 원래의 75% 로 조정
#
# 서버 쪽에 이렇게 띄워 두면 됩니다 (예: 부하가 높으면 스스로 빠지기):
#   while true; do
#     if [ $(cat /proc/loadavg | cut -d. -f1) -gt 10 ]; then echo "drain"; else echo "up"; fi
#   done | socat TCP-LISTEN:9999,reuseaddr,fork -
#
backend web_servers_agent
  balance roundrobin
  # server 줄은 반드시 한 줄로 써야 합니다 (역슬래시 줄바꿈이 통하지 않습니다)
  server web1 10.0.0.11:8080 check agent-check agent-addr 10.0.0.11 agent-port 9999 agent-inter 5s
  server web2 10.0.0.12:8080 check agent-check agent-addr 10.0.0.12 agent-port 9999 agent-inter 5s


# ===========================================================================
# 방법 2. Runtime API : 외부 시스템이 소켓으로 제외
# ===========================================================================
# 배포 스크립트나 모니터링 도구가 관리 소켓으로 명령을 보내는 방식입니다.
# 설정 변경도 재시작도 필요 없고 즉시 반영됩니다.
#
#   # 배포 전 - 트래픽 빼기
#   echo "set server web_servers/web1 state drain" | socat stdio /run/haproxy/haproxy.sock
#
#   # 배포 후 - 복귀
#   echo "set server web_servers/web1 state ready" | socat stdio /run/haproxy/haproxy.sock
#
#   # 가중치만 낮춰 트래픽을 서서히 옮기기 (카나리 배포)
#   echo "set server web_servers/web1 weight 10" | socat stdio /run/haproxy/haproxy.sock
#
#   # 현재 상태 확인
#   echo "show stat" | socat stdio /run/haproxy/haproxy.sock


# ===========================================================================
# 방법 3. 맵 파일 : 요청 단위로 동적 차단
# ===========================================================================
# 서버가 아니라 "요청"을 걸러 내는 경우입니다. 차단 목록을 파일로 두고
# 런타임에 갱신하면 리로드 없이 즉시 반영됩니다.
#
# 사전 준비: 빈 파일이라도 미리 만들어 두어야 합니다.
#   touch /etc/haproxy/blocked.map
#
frontend web_dynamic
  bind :80

  # blocked.map 에 있는 IP 면 차단
  acl is_blocked src,map_ip(/etc/haproxy/blocked.map) -m found
  http-request deny deny_status 403 if is_blocked

  default_backend web_servers_dynamic

backend web_servers_dynamic
  balance roundrobin
  server web1 10.0.0.11:8080 check
  server web2 10.0.0.12:8080 check

# 런타임 갱신 (파일을 고치지 않아도 즉시 반영):
#   echo "add map /etc/haproxy/blocked.map 1.2.3.4 blocked" | socat stdio /run/haproxy/haproxy.sock
#   echo "del map /etc/haproxy/blocked.map 1.2.3.4"         | socat stdio /run/haproxy/haproxy.sock
#   echo "show map /etc/haproxy/blocked.map"                | socat stdio /run/haproxy/haproxy.sock
#
# 주의: 런타임 갱신은 메모리에만 반영됩니다. HAProxy 를 재시작하면
#       사라지므로, 영구히 유지하려면 파일에도 함께 기록해 두세요.
